name: Build Standalone Executables

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: # Allows manual trigger from the GitHub Actions UI

jobs:
  build:
    name: Build on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        include:
          - os: windows-latest
            artifact_name: personal-tax-filing-windows.zip
            zip_cmd: Compress-Archive -Path run.dist\* -DestinationPath personal-tax-filing-windows.zip
          - os: macos-latest
            artifact_name: personal-tax-filing-macos.zip
            zip_cmd: zip -r personal-tax-filing-macos.zip run.dist
          - os: ubuntu-latest
            artifact_name: personal-tax-filing-linux.zip
            zip_cmd: zip -r personal-tax-filing-linux.zip run.dist

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install System Dependencies (Linux)
      if: matrix.os == 'ubuntu-latest'
      run: |
        sudo apt-get update
        sudo apt-get install -y patchelf zip

    - name: Install Python Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install nuitka

    - name: Run Test Suite
      run: |
        python -m unittest discover tests

    - name: Build Standalone Binary with Nuitka
      run: |
        python -m nuitka --standalone --assume-yes-for-downloads --show-progress --include-data-dir=templates=templates --include-data-dir=csv_files=csv_files run.py

    - name: Compress Standalone Folder (Windows)
      if: matrix.os == 'windows-latest'
      shell: pwsh
      run: |
        ${{ matrix.zip_cmd }}

    - name: Compress Standalone Folder (Unix)
      if: matrix.os != 'windows-latest'
      run: |
        ${{ matrix.zip_cmd }}

    - name: Upload Standalone Archive Artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ matrix.os }}-build
        path: ${{ matrix.artifact_name }}

    - name: Create Draft Release and Upload Asset (Tagged push only)
      if: startsWith(github.ref, 'refs/tags/v')
      uses: softprops/action-gh-release@v2
      with:
        draft: true
        prerelease: false
        files: ${{ matrix.artifact_name }}
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

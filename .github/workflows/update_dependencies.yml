name: Weekly Dependency Updates

on:
  schedule:
    # Run weekly on Sundays at midnight UTC
    - cron: "0 0 * * 0"
  workflow_dispatch: # Allows manual trigger from GitHub Actions UI

jobs:
  update-dependencies:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required to commit requirements.txt updates back

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Fetch and Write Latest Versions
      run: |
        python -c "
        import urllib.request, json, re
        pkgs = []
        with open('requirements.txt', 'r') as f:
            for line in f:
                line = line.strip()
                if line and not line.startswith('#'):
                    m = re.match(r'^([a-zA-Z0-9_\-]+)', line)
                    if m:
                        pkgs.append(m.group(1))

        with open('requirements.txt', 'w') as f:
            for pkg in pkgs:
                url = f'https://pypi.org/pypi/{pkg}/json'
                req = urllib.request.Request(url, headers={'User-Agent': 'Mozilla/5.0'})
                try:
                    with urllib.request.urlopen(req) as r:
                        data = json.loads(r.read().decode())
                        version = data['info']['version']
                        f.write(f'{pkg}=={version}\n')
                        print(f'Fetched: {pkg}=={version}')
                except Exception as e:
                    print(f'Error fetching version for {pkg}: {e}')
                    # Keep fallback or fail
                    raise e
        "

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite
      run: |
        python -m unittest discover tests

    - name: Commit and Push Updated Requirements
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add requirements.txt
        if ! git diff --cached --quiet; then
          git commit -m "Automated weekly dependency updates [skip ci]"
          git push
        else
          echo "All dependencies are already at their latest versions."
        fi

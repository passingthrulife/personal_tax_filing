name: Daily SBI Forex Rates Sync

on:
  schedule:
    # Run daily at 10:30 AM UTC (4:00 PM IST) and 4:30 PM UTC (10:00 PM IST)
    # This covers the publication windows of SBI daily card rates
    - cron: "30 10,16 * * *"
  workflow_dispatch: # Allows manual trigger from GitHub UI

jobs:
  update-rates:
    runs-on: ubuntu-latest

    permissions:
      contents: write # Required for committing changes back to the repository

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v7

    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: "3.10"

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install requests pypdf

    - name: Fetch and Process Daily Rates
      run: |
        python scripts/update_rates_daily.py

    - name: Commit and Push Changes
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.com"
        git add csv_files/*.csv
        if [ -d pdf_files ]; then
          git add pdf_files/
        fi
        if ! git diff --cached --quiet; then
          git commit -m "Automated daily SBI forex rates and PDF update [skip ci]"
          git push
        else
          echo "No new rate or PDF updates found."
        fi
